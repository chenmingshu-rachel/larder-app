}

function uid() {
  return `id_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function addDays(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}

function formatDateDisplay(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function getWeekDates(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = dt.getDay();
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(dt);
  monday.setDate(dt.getDate() + diffToMonday);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d2 = new Date(monday);
    d2.setDate(monday.getDate() + i);
    dates.push(`${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, "0")}-${String(d2.getDate()).padStart(2, "0")}`);
  }
  return dates;
}

function formatWeekRange(dates) {
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const opts = { month: "short", day: "numeric" };
  return `${parse(dates[0]).toLocaleDateString("en-US", opts)} – ${parse(dates[6]).toLocaleDateString("en-US", opts)}`;
}

function formatDayShort(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return { weekday: dt.toLocaleDateString("en-US", { weekday: "short" }), day: dt.getDate(), isToday: dateStr === todayStr() };
}

function parseQtyStr(raw) {
  if (!raw) return null;
  const s = raw.trim();
  if (!s) return null;
  const match = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if (!match) return null;
  const numToken = match[1];
  const unit = (match[2] || "").trim().toLowerCase();
  let num;
  if (numToken.includes("/")) {
    const spaceParts = numToken.split(" ");
    if (spaceParts.length === 2) {
      const whole = parseFloat(spaceParts[0]);
      const [n, d] = spaceParts[1].split("/").map(Number);
      num = whole + (d ? n / d : 0);
    } else {
      const [n, d] = numToken.split("/").map(Number);
      num = d ? n / d : NaN;
    }
  } else {
    num = parseFloat(numToken);
  }
  if (isNaN(num)) return null;
  return { num, unit };
}

function formatNum(n) {
  const rounded = Math.round(n * 100) / 100;
  return String(rounded);
}

function aggregateIngredients(list) {
  const groups = new Map();
  list.forEach(({ name, qty }) => {
    if (!name || !name.trim()) return;
    const key = name.trim().toLowerCase();
    if (!groups.has(key)) groups.set(key, { displayName: name.trim(), qtys: [] });
    groups.get(key).qtys.push((qty || "").trim());
  });
  return Array.from(groups.values()).map(({ displayName, qtys }) => {
    const nonEmpty = qtys.filter(Boolean);
    if (nonEmpty.length === 0) return { name: displayName, qty: "" };
    const parsed = nonEmpty.map(parseQtyStr);
    const allParsed = parsed.every((p) => p !== null);
    const units = parsed.map((p) => (p ? p.unit : ""));
    const sameUnit = allParsed && new Set(units).size <= 1;
    if (sameUnit) {
      const sum = parsed.reduce((acc, p) => acc + p.num, 0);
      const unit = units[0] || "";
      return { name: displayName, qty: `${formatNum(sum)}${unit ? " " + unit : ""}` };
    }
    return { name: displayName, qty: nonEmpty.join(" + ") };
  });
}

function toStepRows(steps) {
  const arr = Array.isArray(steps)
    ? steps
    : typeof steps === "string" && steps.trim()
    ? steps.split("\n").map((s) => s.trim()).filter(Boolean)
    : [];
  return arr.length ? arr.map((text) => ({ id: uid(), text })) : [{ id: uid(), text: "" }];
}
function normalizeStepsForDisplay(steps) {
  if (Array.isArray(steps)) return steps.filter(Boolean);
  if (typeof steps === "string" && steps.trim()) return steps.split("\n").map((s) => s.trim()).filter(Boolean);
  return [];
}
function renderStepsList(steps) {
  const list = normalizeStepsForDisplay(steps);
  if (list.length === 0) return null;
  return (
    <ol className="steps-list">
      {list.map((s, i) => <li key={i}>{s}</li>)}
    </ol>
  );
}

async function loadKey(key, fallback) {
  if (!supabaseClient) return fallback;
  try {
    const { data, error } = await supabaseClient.from("larder_data").select("value").eq("id", key).maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  } catch (e) {
    console.error("Load failed for", key, e);
    return fallback;
  }
}

async function saveKey(key, value) {
  if (!supabaseClient) return;
  try {
    await supabaseClient.from("larder_data").upsert({ id: key, value, updated_at: new Date().toISOString() });
  } catch (e) {
    console.error("Save failed for", key, e);
  }
}

function IngredientEditor({ ingredients, onChange }) {
  const update = (id, field, value) =>
    onChange(ingredients.map((row) => (row.id === id ? { ...row, [field]: value } : row)));
  const addRow = () => onChange([...ingredients, { id: uid(), name: "", qty: "" }]);
  const removeRow = (id) => onChange(ingredients.filter((r) => r.id !== id));
  return (
    <div className="ingredient-editor">
      {ingredients.map((row) => (
        <div className="ingredient-row" key={row.id}>
          <input
            className="input ing-name"
            placeholder="Ingredient"
            value={row.name}
            onChange={(e) => update(row.id, "name", e.target.value)}
          />
          <input
            className="input ing-qty"
            placeholder="Qty"
            value={row.qty}
            onChange={(e) => update(row.id, "qty", e.target.value)}
          />
          <button className="btn-icon" onClick={() => removeRow(row.id)} aria-label="Remove ingredient">
            <X size={16} />
          </button>
        </div>
      ))}
      <button className="btn-secondary btn-small" onClick={addRow}>
        <Plus size={14} /> Add ingredient
      </button>
    </div>
  );
}

function StepsEditor({ steps, onChange }) {
  const update = (id, value) => onChange(steps.map((s) => (s.id === id ? { ...s, text: value } : s)));
  const addRow = () => onChange([...steps, { id: uid(), text: "" }]);
  const removeRow = (id) => onChange(steps.filter((s) => s.id !== id));
  return (
    <div className="steps-editor">
      {steps.map((s, idx) => (
        <div className="step-row" key={s.id}>
          <span className="step-bullet">{idx + 1}</span>
          <textarea
            className="textarea step-input"
            rows={2}
            placeholder={`Step ${idx + 1}`}
            value={s.text}
            onChange={(e) => update(s.id, e.target.value)}
          />
          <button className="btn-icon" onClick={() => removeRow(s.id)} aria-label="Remove step">
            <X size={16} />
          </button>
        </div>
      ))}
      <button className="btn-secondary btn-small" onClick={addRow}>
        <Plus size={14} /> Add step
      </button>
    </div>
  );
}

              <textarea
                className="textarea"
                placeholder="Optional — substitutions, tips, what worked last time..."
                value={mealDraft.notes}
                onChange={(e) => setMealDraft({ ...mealDraft, notes: e.target.value })}
              />
              {!mealDraft.fromMenu && (
                <label className="checkbox-row">
                  <input type="checkbox" checked={mealDraft.saveToMenu} onChange={(e) => setMealDraft({ ...mealDraft, saveToMenu: e.target.checked })} />
                  Also save to Menu for reuse
                </label>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn-primary" onClick={saveMeal} disabled={!mealDraft.name.trim()}>Save</button>
            </div>
          </div>
        </div>
      )}

      {showMenuForm && menuDraft && (
        <div className="modal-overlay" onClick={() => setShowMenuForm(false)}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="modal-handle" />
            <div className="modal-header">
              <h3>{menuDraft.id ? "Edit recipe" : "New recipe"}</h3>
              <button className="btn-icon" onClick={() => setShowMenuForm(false)}><X size={20} /></button>
            </div>
            <div className="modal-body">
              <input className="input" placeholder="Recipe name" value={menuDraft.name} onChange={(e) => setMenuDraft({ ...menuDraft, name: e.target.value })} />
              <input className="input" placeholder="Tags, comma separated (e.g. quick, vegetarian)" value={menuDraft.tags} onChange={(e) => setMenuDraft({ ...menuDraft, tags: e.target.value })} />
              <label className="field-label">Ingredients</label>
              <IngredientEditor ingredients={menuDraft.ingredients} onChange={(ings) => setMenuDraft({ ...menuDraft, ingredients: ings })} />
              <label className="field-label">How to cook it</label>
              <StepsEditor steps={menuDraft.steps} onChange={(steps) => setMenuDraft({ ...menuDraft, steps })} />
              <label className="field-label">Notes</label>
              <textarea
                className="textarea"
                placeholder="Optional — substitutions, tips, what worked last time..."
                value={menuDraft.notes}
                onChange={(e) => setMenuDraft({ ...menuDraft, notes: e.target.value })}
              />
            </div>
            <div className="modal-footer">
              <button className="btn-primary" onClick={saveMenuItem} disabled={!menuDraft.name.trim()}>Save recipe</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
